---
version: 0.1
runtime:
  language: python
  version: "3.11"
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

matrix:
  files:
    - Tests/LtTodoApp.robot
    - Tests/LtSeleniumPlayground.robot

runson: win
retryOnFailure: true
maxRetries: 1

env:
  TARGET_OS: Windows 11

cacheKey: '{{ checksum "requirements.txt" }}'

cacheDirectories:
  - pip_cache

pre:
  - python -m pip install --upgrade pip
  - python -m pip install -r requirements.txt --cache-dir pip_cache

post:
  - type yaml\win\robot_hyperexecute_matrix_sample.yaml

mergeArtifacts: true

uploadArtefacts:
  - name: HTML_Reports
    path:
      - /*.html
  - name: XML_Reports
    path:
      - /*.xml

report: true

partialReports:
  type: json
  location: /
  frameworkName: extent

testSuites:
  - make test_windows_10_edge_latest
  - make test_windows_10_chrome_latest

jobLabel:
  - selenium-robot
  - win
  - matrix