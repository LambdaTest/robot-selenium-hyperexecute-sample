---
version: 0.1
runtime:
  language: python
  version: "3.11"
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

runson: win

autosplit: true
retryOnFailure: true

maxRetries: 1
concurrency: 2

env:
  TARGET_OS: Windows 10

cacheKey: '{{ checksum "requirements.txt" }}'

cacheDirectories:
  - pip_cache

pre:
  - python -m pip install -r requirements.txt --cache-dir pip_cache

post:
  - type yaml\win\robot_hyperexecute_autosplit_sample.yaml

mergeArtifacts: true

uploadArtefacts:
  - name: HTML_Reports
    path:
      - /*.html

  - name: XML_Reports
    path:
      - /*.xml

report: true

partialReports:
  type: json
  location: /
  frameworkName: extent

testDiscovery:
  type: raw
  mode: remote
  command: grep 'test_windows' Makefile | sed 's/\(.*\):/\1 /'

testRunnerCommand: make $test

jobLabel:
  - selenium-robot
  - win
  - autosplit