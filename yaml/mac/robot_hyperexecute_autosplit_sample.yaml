---
version: 0.1
globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

runson: mac

autosplit: true
retryOnFailure: true

maxRetries: 1
concurrency: 2

env:
  TARGET_OS: MacOS Catalina

cacheKey: '{{ checksum "requirements.txt" }}'

cacheDirectories:
  - pip_cache

pre:
  - pip3 install -r requirements.txt --cache-dir pip_cache

post:
  - cat yaml/mac/robot_hyperexecute_autosplit_sample.yaml

mergeArtifacts: true

uploadArtefacts:
  - name: HTML_Reports
    path:
      - /*.html

  - name: XML_Reports
    path:
      - /*.xml

report: true

partialReports:
  type: json
  location: /
  frameworkName: extent

testDiscovery:
  type: raw
  mode: remote
  command: grep 'test_mac' Makefile | sed 's/\(.*\):/\1 /'

testRunnerCommand: make $test

jobLabel:
  - selenium-robot
  - mac
  - autosplit