---
version: 0.1

globalTimeout: 90
testSuiteTimeout: 90
testSuiteStep: 90

matrix:
  files:
    - Tests/LtTodoApp.robot
    - Tests/LtSeleniumPlayground.robot

runson: mac

retryOnFailure: true
maxRetries: 1

env:
  TARGET_OS: MacOS Catalina

cacheKey: '{{ checksum "requirements.txt" }}'

cacheDirectories:
  - pip_cache

pre:
  - python3 -m pip install -r requirements.txt --cache-dir pip_cache

post:
  - cat yaml/mac/robot_hyperexecute_matrix_sample.yaml

mergeArtifacts: true

uploadArtefacts:
  - name: HTML_Reports
    path:
      - /*.html

  - name: XML_Reports
    path:
      - /*.xml

report: true

partialReports:
  type: json
  location: /
  frameworkName: extent

testSuites:
  - make test_mac_firefox_latest
  - make test_mac_chrome_latest

jobLabel:
  - selenium-robot
  - mac
  - matrix