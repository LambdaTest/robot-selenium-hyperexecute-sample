---
version: 0.1

globalTimeout: 150
testSuiteTimeout: 150
testSuiteStep: 150

runson: ${matrix.os}

runtime:
  language: python
  version: "3.11"

retryOnFailure: false
autosplit: true
maxRetries: 1
parallelism: 2
concurrency: 3

matrix:
  os:
    - mac
    - win
    - linux

env:
  # PAT: ${{ .secrets.testKey }}
  TARGET_OS: LINUX

cacheKey: '{{ checksum "requirements.txt" }}'

cacheDirectories:
  - pip_cache

pre:
  - python3 -m pip install --upgrade pip
  - python3 -m pip install -r requirements.txt --cache-dir pip_cache

post:
  - cat yaml/robot_hyperexecute_hybrid_sample.yaml

mergeArtifacts: true

uploadArtefacts:
  - name: HTML_Reports
    path:
      - /*.html
  - name: XML_Reports
    path:
      - /*.xml

report: true

partialReports:
  type: json
  location: /
  frameworkName: extent

testDiscovery:
  type: raw
  mode: remote
  command: grep 'test_linux' Makefile | sed 's/\(.*\):/\1 /'

testRunnerCommand: make $test

jobLabel:
  - selenium-robot
  - hybrid